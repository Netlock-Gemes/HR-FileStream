services:
  hr-filestream:
    container_name: hr-filestream

    build: .

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8080:8080"

    # Bot session and poster cache survive rebuilds
    volumes:
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"