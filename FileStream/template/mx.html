<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening MX Player Pro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23241018%27/%3E%3Cpath d=%27M11 8l14 8-14 8z%27 fill=%27%23f2b84b%27/%3E%3C/svg%3E" />
  <style>
    {% include "theme.css" %}
    body { display: grid; place-items: center; padding: 16px; }
    main { width: min(100%, 30rem); }
    p { margin: 1rem 0 1.5rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>{{ file_name }}</h1>
    <p>Opening in MX Player Pro. If it doesn't start, use the button below.</p>
    <a class="button lit" id="open" href="intent:{{ file_url }}#Intent;package=com.mxtech.videoplayer.pro;type=video/*;end">Open in MX Player Pro</a>
    <a class="button" href="{{ file_url }}">Play in browser</a>
  </main>
  <script>location.href = document.getElementById("open").href;</script>
</body>
</html>
