<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ file_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23241018%27/%3E%3Cpath d=%27M11 8l14 8-14 8z%27 fill=%27%23f2b84b%27/%3E%3C/svg%3E" />
  <style>
    {% include "theme.css" %}
    body { display: grid; place-items: center; padding: 16px; }
    main { width: min(100%, 36rem); }
    .size { margin: .5rem 0 1.5rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>{{ file_name }}</h1>
    <p class="size">{{ file_size }}</p>
    <a class="button lit" href="{{ file_url }}" download>Download</a>
  </main>
</body>
</html>
