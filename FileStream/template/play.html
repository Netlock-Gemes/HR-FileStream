<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ file_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23160c12%27/%3E%3Cpath d=%27M11 8l14 8-14 8z%27 fill=%27%23f5bd55%27/%3E%3C/svg%3E" />
  <style>
    {% include "theme.css" %}
    .theatre { position: relative; padding: clamp(0px, 2.2vw, 2rem) clamp(0px, 3vw, 3rem) 0; overflow: clip; }
    /* The film's own colours light the room around the screen */
    #ambience {
      position: absolute; inset: -6% 0 auto; width: 100%; height: 112%;
      filter: blur(70px) saturate(1.5); opacity: 0; transition: opacity 1.2s; pointer-events: none;
    }
    #ambience.on { opacity: .55; }
    .player {
      position: relative; max-width: 88rem; margin: 0 auto; overflow: hidden; outline: none;
      background: #000; border-radius: clamp(0px, 1.4vw, 16px);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .9), 0 0 0 1px var(--line);
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .player:fullscreen { max-width: none; border-radius: 0; box-shadow: none; display: grid; place-items: center; }
    video { display: block; width: 100%; max-height: min(78dvh, 56vw * 1.4); margin: 0 auto; background: #000; }
    .player:fullscreen video { width: 100%; height: 100%; max-height: none; }
    .player:not(.custom) .layer { display: none; }
    .layer { position: absolute; }

    .shade {
      inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
      background: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 22%, transparent 58%, rgba(0, 0, 0, .82));
    }
    .top {
      inset: 0 0 auto; padding: clamp(.75rem, 2vw, 1.25rem) clamp(.9rem, 2.4vw, 1.5rem);
      font: 400 clamp(1.05rem, .9rem + .8vw, 1.5rem)/1.2 var(--title); pointer-events: none;
      opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s var(--ease);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
    }
    .big {
      top: 50%; left: 50%; display: grid; place-items: center; width: clamp(4rem, 9vw, 5.5rem); aspect-ratio: 1;
      padding: 0; border: 1px solid rgba(255, 255, 255, .22); border-radius: 50%; color: #fff; cursor: pointer;
      background: rgba(20, 11, 16, .45); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
      transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none;
      transition: opacity .22s, transform .3s var(--ease), background-color .2s;
    }
    .big svg { width: 42%; height: 42%; margin-left: 5%; }
    .big:hover { background: rgba(245, 189, 85, .9); color: #241305; }
    .paused .big { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .waiting .big { opacity: 0; pointer-events: none; }

    .spinner {
      top: 50%; left: 50%; width: 3.25rem; height: 3.25rem; margin: -1.625rem 0 0 -1.625rem; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .16); border-top-color: var(--amber); animation: spin .8s linear infinite;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .waiting .spinner { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .flash {
      top: 50%; display: grid; place-items: center; min-width: 5.25rem; padding: .55rem .9rem; border-radius: 999px;
      background: rgba(20, 11, 16, .6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font: 700 .92rem/1 var(--ui); font-variant-numeric: tabular-nums;
      transform: translate(-50%, -50%); opacity: 0; pointer-events: none;
    }
    .flash.show { animation: flash .7s var(--ease); }
    @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.85); } 18%, 62% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; } }

    .bar {
      inset: auto 0 0; padding: 0 clamp(.6rem, 1.8vw, 1.1rem) calc(clamp(.3rem, 1vw, .6rem) + env(safe-area-inset-bottom));
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .25s, transform .25s var(--ease);
    }
    .controls-on { cursor: default; }
    .controls-on .shade { opacity: 1; }
    .controls-on .top { opacity: 1; transform: none; }
    .controls-on .bar { opacity: 1; transform: none; pointer-events: auto; }
    .player:not(.controls-on) { cursor: none; }

    .scrub { position: relative; height: 1.5rem; display: flex; align-items: center; cursor: pointer; touch-action: none; outline-offset: 0; }
    .rail { position: relative; width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .22); overflow: hidden; transition: height .15s var(--ease); }
    .scrub:hover .rail, .scrub.dragging .rail, .scrub:focus-visible .rail { height: 7px; }
    .buffered, .played { position: absolute; inset: 0 auto 0 0; }
    .buffered { background: rgba(255, 255, 255, .3); }
    .played { width: 0; background: linear-gradient(90deg, var(--amber-deep), var(--amber)); }
    .knob {
      position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
      background: #fff6e4; box-shadow: 0 0 0 4px rgba(245, 189, 85, .3), 0 2px 8px rgba(0, 0, 0, .5);
      transform: scale(0); transition: transform .15s var(--ease); pointer-events: none;
    }
    .scrub:hover .knob, .scrub.dragging .knob, .scrub:focus-visible .knob { transform: scale(1); }
    .tip {
      position: absolute; bottom: 1.6rem; left: 0; padding: .28rem .5rem; border-radius: 6px; background: rgba(14, 7, 11, .9);
      font: 700 .78rem/1 var(--ui); font-variant-numeric: tabular-nums; transform: translateX(-50%); opacity: 0;
      pointer-events: none; transition: opacity .12s;
    }
    .scrub:hover .tip, .scrub.dragging .tip { opacity: 1; }

    .row { display: flex; align-items: center; gap: clamp(0rem, .5vw, .25rem); }
    .ctl {
      position: relative; display: grid; place-items: center; flex: none; width: 2.6rem; height: 2.6rem; padding: 0; border: 0;
      border-radius: 9px; background: none; color: #fff; cursor: pointer; font: 700 .82rem/1 var(--ui);
      transition: background-color .15s, color .15s, transform .12s var(--ease);
    }
    .ctl:hover { background: rgba(255, 255, 255, .13); }
    .ctl:active { transform: scale(.92); }
    .ctl svg { width: 1.4rem; height: 1.4rem; fill: currentColor; }
    .ctl .on-state { display: none; }
    .ctl[aria-pressed="true"] .on-state { display: block; }
    .ctl[aria-pressed="true"] .off-state { display: none; }
    .ctl.speed { width: auto; min-width: 2.6rem; padding: 0 .45rem; font-variant-numeric: tabular-nums; }
    .time { padding: 0 .5rem; border: 0; background: none; color: #fff; font: 600 .86rem/1 var(--ui); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
    .time span { color: rgba(255, 255, 255, .62); }
    .push { flex: 1; }
    .volume { display: flex; align-items: center; }
    .volume-track { position: relative; width: 0; height: 2.6rem; overflow: hidden; display: flex; align-items: center; cursor: pointer; touch-action: none; transition: width .2s var(--ease); }
    .volume:hover .volume-track, .volume:focus-within .volume-track, .volume-track.dragging { width: 5rem; margin-right: .4rem; }
    .volume-rail { position: relative; width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .25); }
    .volume-level { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #fff; }

    .menu {
      right: clamp(.6rem, 1.8vw, 1.1rem); bottom: 4.2rem; display: grid; min-width: 7.5rem; padding: .3rem; border-radius: 12px;
      background: rgba(20, 11, 16, .86); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .8), 0 0 0 1px var(--line);
    }
    .menu button {
      min-height: 2.25rem; padding: 0 .7rem; border: 0; border-radius: 8px; background: none; color: #fff;
      font: 600 .88rem/1 var(--ui); font-variant-numeric: tabular-nums; text-align: left; cursor: pointer;
    }
    .menu button:hover { background: rgba(255, 255, 255, .12); }
    .menu button[aria-checked="true"] { color: var(--amber); }

    .fail {
      inset: 0; display: grid; place-content: center; gap: .9rem; justify-items: center; padding: 1.5rem; text-align: center;
      background: rgba(14, 7, 11, .88);
    }
    .fail p { max-width: 26rem; }

    .details { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.25rem 2.5rem; align-items: end; max-width: calc(88rem + 6vw); margin: 0 auto; padding: clamp(1.5rem, 3.5vw, 2.75rem) clamp(16px, 3vw, 3rem) 3.5rem; position: relative; }
    .details h1 { font-size: clamp(1.7rem, 1.3rem + 1.9vw, 2.9rem); line-height: 1.08; }
    .facts { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .85rem; }
    .fact { padding: .25rem .65rem; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: .85rem; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; }
    @media (max-width: 52rem) {
      .details { grid-template-columns: minmax(0, 1fr); }
      .actions { justify-content: flex-start; }
      .actions .button { flex: 1 1 calc(50% - .5rem); }
    }
    @media (max-width: 34rem) {
      .theatre { padding: 0; }
      .player { border-radius: 0; box-shadow: none; }
      .hide-small { display: none; }
      .ctl { width: 2.35rem; height: 2.35rem; }
      .time { padding: 0 .25rem; font-size: .8rem; }
      video { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="theatre">
    <canvas id="ambience" width="32" height="18" aria-hidden="true"></canvas>
    <div class="player paused controls-on" id="stage" tabindex="-1">
      <video id="player" src="{{ file_url }}" controls playsinline preload="metadata"{% if poster %} poster="{{ poster }}"{% endif %}></video>
      <div class="layer shade"></div>
      <div class="layer top">{{ file_name }}</div>
      <button class="layer big" id="big" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.8l11.3-7.4c.6-.4.6-1.3 0-1.7L8.6 3.8C7.9 3.3 7 3.8 7 4.6z"/></svg>
      </button>
      <div class="layer spinner"></div>
      <div class="layer flash" id="flash"></div>
      <div class="layer bar" id="bar">
        <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="rail"><div id="buffered"></div><div class="played" id="played"></div></div>
          <div class="knob" id="knob"></div>
          <div class="tip" id="tip">0:00</div>
        </div>
        <div class="row">
          <button class="ctl" id="toggle" type="button" aria-label="Play" aria-pressed="false">
            <svg class="off-state" viewBox="0 0 24 24"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.8l11.3-7.4c.6-.4.6-1.3 0-1.7L8.6 3.8C7.9 3.3 7 3.8 7 4.6z"/></svg>
            <svg class="on-state" viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.4"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.4"/></svg>
          </button>
          <button class="ctl hide-small" id="back" type="button" aria-label="Back 10 seconds">
            <svg viewBox="0 0 24 24"><path d="M12 5V2.2c0-.4-.5-.7-.8-.4L7 5.6c-.3.2-.3.6 0 .8l4.2 3.8c.3.3.8 0 .8-.4V7a6 6 0 1 1-6 6 1 1 0 0 0-2 0 8 8 0 1 0 8-8z"/></svg>
          </button>
          <button class="ctl hide-small" id="forward" type="button" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 24 24"><path d="M12 5V2.2c0-.4.5-.7.8-.4L17 5.6c.3.2.3.6 0 .8l-4.2 3.8c-.3.3-.8 0-.8-.4V7a6 6 0 1 0 6 6 1 1 0 0 1 2 0 8 8 0 1 1-8-8z"/></svg>
          </button>
          <div class="volume">
            <button class="ctl" id="mute" type="button" aria-label="Mute" aria-pressed="false">
              <svg class="off-state" viewBox="0 0 24 24"><path d="M4 9.5v5c0 .6.4 1 1 1h3l4.3 3.6c.6.5 1.7.1 1.7-.8V5.7c0-.9-1.1-1.3-1.7-.8L8 8.5H5c-.6 0-1 .4-1 1z"/><path d="M16.5 8.3a1 1 0 0 1 1.4 0 5.2 5.2 0 0 1 0 7.4 1 1 0 0 1-1.4-1.4 3.2 3.2 0 0 0 0-4.6 1 1 0 0 1 0-1.4z"/></svg>
              <svg class="on-state" viewBox="0 0 24 24"><path d="M4 9.5v5c0 .6.4 1 1 1h3l4.3 3.6c.6.5 1.7.1 1.7-.8V5.7c0-.9-1.1-1.3-1.7-.8L8 8.5H5c-.6 0-1 .4-1 1z"/><path d="M16.3 9.3a1 1 0 0 1 1.4 0l1.3 1.3 1.3-1.3a1 1 0 1 1 1.4 1.4L20.4 12l1.3 1.3a1 1 0 0 1-1.4 1.4L19 13.4l-1.3 1.3a1 1 0 0 1-1.4-1.4l1.3-1.3-1.3-1.3a1 1 0 0 1 0-1.4z"/></svg>
            </button>
            <div class="volume-track" id="volume" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div class="volume-rail"><div class="volume-level" id="level"></div></div>
            </div>
          </div>
          <button class="time" id="time" type="button" aria-label="Switch between elapsed and remaining time">0:00 <span>/ 0:00</span></button>
          <div class="push"></div>
          <button class="ctl speed" id="speed" type="button" aria-label="Playback speed" aria-haspopup="menu" aria-expanded="false">1×</button>
          <button class="ctl hide-small" id="pip" type="button" aria-label="Picture in picture" hidden>
            <svg viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7c0-1.1.9-2 2-2zm0 2v10h16V7H4z"/><rect x="11.5" y="11" width="7" height="4.5" rx="1"/></svg>
          </button>
          <button class="ctl" id="full" type="button" aria-label="Full screen" aria-pressed="false">
            <svg class="off-state" viewBox="0 0 24 24"><path d="M4 9a1 1 0 0 0 2 0V6h3a1 1 0 0 0 0-2H5a1 1 0 0 0-1 1v4zm11-5a1 1 0 0 0 0 2h3v3a1 1 0 0 0 2 0V5a1 1 0 0 0-1-1h-4zM6 15a1 1 0 0 0-2 0v4c0 .6.4 1 1 1h4a1 1 0 0 0 0-2H6v-3zm14 0a1 1 0 0 0-2 0v3h-3a1 1 0 0 0 0 2h4c.6 0 1-.4 1-1v-4z"/></svg>
            <svg class="on-state" viewBox="0 0 24 24"><path d="M9 4a1 1 0 0 0-2 0v3H4a1 1 0 0 0 0 2h4c.6 0 1-.4 1-1V4zm8 0a1 1 0 0 0-2 0v4c0 .6.4 1 1 1h4a1 1 0 0 0 0-2h-3V4zM4 15a1 1 0 0 0 0 2h3v3a1 1 0 0 0 2 0v-4c0-.6-.4-1-1-1H4zm12 0c-.6 0-1 .4-1 1v4a1 1 0 0 0 2 0v-3h3a1 1 0 0 0 0-2h-4z"/></svg>
          </button>
        </div>
      </div>
      <div class="layer menu" id="speed-menu" role="menu" aria-label="Playback speed" hidden></div>
      <div class="layer fail" id="fail" hidden>
        <p>This browser can't play this file. Open it in VLC or MX Player.</p>
        <a class="button lit" href="vlc://{{ file_url }}">Open in VLC</a>
      </div>
    </div>
  </div>
  <main class="details">
    <div>
      <h1>{{ file_name }}</h1>
      <div class="facts">
        <span class="fact">{{ file_size }}</span>
        {% for name in cast %}<span class="fact">{{ name }}</span>{% endfor %}
      </div>
    </div>
    <div class="actions">
      <a class="button lit" href="vlc://{{ file_url }}">Open in VLC</a>
      <a class="button" id="mx" href="intent:{{ file_url }}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end">Open in MX Player</a>
      <a class="button" id="mx-pro" href="intent:{{ file_url }}#Intent;package=com.mxtech.videoplayer.pro;type=video/*;end">Open in MX Player Pro</a>
      <a class="button" href="{{ file_url }}" download>Download</a>
      <button class="button" id="copy" type="button">Copy link</button>
    </div>
  </main>
  <script>
    const fileUrl = {{ file_url|tojson }};
    const $ = (id) => document.getElementById(id);
    const copyButton = $("copy");
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(fileUrl);
      } catch {
        const field = document.createElement("input");
        field.value = fileUrl;
        document.body.append(field);
        field.select();
        document.execCommand("copy");
        field.remove();
      }
      copyButton.textContent = "Link copied";
      setTimeout(() => { copyButton.textContent = "Copy link"; }, 2000);
    });
    if (!/Android/i.test(navigator.userAgent)) {
      $("mx").remove();
      $("mx-pro").remove();
    }

    /* ---------- Player ---------- */

    const SKIP = 10;
    const HIDE_AFTER = 2600;
    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    const video = $("player");
    const stage = $("stage");
    const scrub = $("scrub");
    const resumeKey = "hrp:" + fileUrl;
    let hideTimer, waitTimer, tapTimer, lastTap = 0;
    let dragging = false, dragTime = 0, showRemaining = false, resumeChecked = false, lastSaved = 0;

    // localStorage can throw in private windows, and these are only conveniences
    function remember(key, value) { try { localStorage.setItem(key, value); } catch {} }
    function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function forget(key) { try { localStorage.removeItem(key); } catch {} }

    function clock(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor(total / 60) % 60;
      const rest = String(total % 60).padStart(2, "0");
      return hours ? hours + ":" + String(minutes).padStart(2, "0") + ":" + rest : minutes + ":" + rest;
    }

    function showControls() {
      stage.classList.add("controls-on");
      clearTimeout(hideTimer);
      if (!video.paused && !dragging && $("speed-menu").hidden) {
        hideTimer = setTimeout(() => stage.classList.remove("controls-on"), HIDE_AFTER);
      }
    }

    function flash(text, x = 50) {
      const box = $("flash");
      box.textContent = text;
      box.style.left = x + "%";
      box.classList.remove("show");
      void box.offsetWidth;
      box.classList.add("show");
    }

    function toggle() {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    }

    function seekBy(seconds, x = 50) {
      video.currentTime = Math.min(Math.max(video.currentTime + seconds, 0), video.duration || 0);
      flash((seconds > 0 ? "+" : "−") + Math.abs(seconds) + "s", x);
      showControls();
    }

    function setVolume(value, save = true) {
      video.volume = Math.min(Math.max(value, 0), 1);
      video.muted = video.volume === 0;
      if (save) remember("hrp:volume", video.volume);
    }

    function drawVolume() {
      const level = video.muted ? 0 : video.volume;
      $("level").style.width = level * 100 + "%";
      $("volume").setAttribute("aria-valuenow", Math.round(level * 100));
      $("mute").setAttribute("aria-pressed", String(video.muted || level === 0));
      $("mute").setAttribute("aria-label", video.muted ? "Unmute" : "Mute");
    }

    function drawProgress(time = video.currentTime) {
      const percent = video.duration ? (time / video.duration) * 100 : 0;
      $("played").style.width = percent + "%";
      $("knob").style.left = percent + "%";
      scrub.setAttribute("aria-valuenow", Math.round(percent));
      scrub.setAttribute("aria-valuetext", clock(time) + " of " + clock(video.duration));
      const shown = showRemaining ? "−" + clock(video.duration - time) : clock(time);
      $("time").firstChild.textContent = shown + " ";
      $("time").lastElementChild.textContent = "/ " + clock(video.duration);
    }

    function drawBuffered() {
      const ranges = [];
      for (let index = 0; index < video.buffered.length; index += 1) {
        const left = (video.buffered.start(index) / video.duration) * 100;
        const width = ((video.buffered.end(index) - video.buffered.start(index)) / video.duration) * 100;
        ranges.push(`<i class="buffered" style="left:${left}%;width:${width}%"></i>`);
      }
      $("buffered").innerHTML = ranges.join("");
    }

    function timeAt(event) {
      const box = scrub.getBoundingClientRect();
      return (Math.min(Math.max(event.clientX - box.left, 0), box.width) / box.width) * (video.duration || 0);
    }

    function moveTip(event) {
      const box = scrub.getBoundingClientRect();
      const time = timeAt(event);
      const tip = $("tip");
      tip.textContent = clock(time);
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(event.clientX - box.left, half), box.width - half) + "px";
      return time;
    }

    // Only the release seeks, so dragging doesn't send the server a burst of range requests
    scrub.addEventListener("pointermove", (event) => {
      const time = moveTip(event);
      if (dragging) { dragTime = time; drawProgress(time); }
    });
    scrub.addEventListener("pointerdown", (event) => {
      dragging = true;
      dragTime = moveTip(event);
      scrub.setPointerCapture(event.pointerId);
      scrub.classList.add("dragging");
      drawProgress(dragTime);
      showControls();
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      scrub.classList.remove("dragging");
      video.currentTime = dragTime;
      showControls();
    }
    scrub.addEventListener("pointerup", endDrag);
    scrub.addEventListener("pointercancel", () => { dragging = false; scrub.classList.remove("dragging"); drawProgress(); });

    function volumeAt(event) {
      const box = $("volume").getBoundingClientRect();
      setVolume((event.clientX - box.left) / box.width);
    }
    $("volume").addEventListener("pointerdown", (event) => {
      $("volume").setPointerCapture(event.pointerId);
      $("volume").classList.add("dragging");
      volumeAt(event);
    });
    $("volume").addEventListener("pointermove", (event) => { if ($("volume").classList.contains("dragging")) volumeAt(event); });
    $("volume").addEventListener("pointerup", () => $("volume").classList.remove("dragging"));

    function closeMenu() {
      $("speed-menu").hidden = true;
      $("speed").setAttribute("aria-expanded", "false");
    }

    function drawSpeeds() {
      $("speed").textContent = video.playbackRate + "×";
      for (const button of $("speed-menu").children) {
        button.setAttribute("aria-checked", String(Number(button.dataset.rate) === video.playbackRate));
      }
    }

    for (const rate of SPEEDS) {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("role", "menuitemradio");
      button.dataset.rate = rate;
      button.textContent = rate === 1 ? "Normal" : rate + "×";
      button.addEventListener("click", () => {
        video.playbackRate = rate;
        remember("hrp:speed", rate);
        closeMenu();
        showControls();
      });
      $("speed-menu").append(button);
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement) return document.exitFullscreen();
      if (stage.requestFullscreen) {
        await stage.requestFullscreen().catch(() => {});
        screen.orientation?.lock?.("landscape").catch(() => {});
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();  // iPhone only offers the system player here
      }
    }

    /* Mouse: click plays, double click goes full screen. Touch: tap shows the
       controls, and a double tap on either side skips. */
    function onScreenTap(event) {
      const box = stage.getBoundingClientRect();
      const x = (event.clientX - box.left) / box.width;
      const now = Date.now();
      const isDouble = now - lastTap < 280;
      lastTap = now;

      if (event.pointerType === "touch") {
        if (isDouble && (x < 0.38 || x > 0.62)) {
          clearTimeout(tapTimer);
          seekBy(x < 0.5 ? -SKIP : SKIP, x < 0.5 ? 22 : 78);
          return;
        }
        tapTimer = setTimeout(() => {
          if (stage.classList.contains("controls-on") && !video.paused) {
            clearTimeout(hideTimer);
            stage.classList.remove("controls-on");
          } else {
            showControls();
          }
        }, 240);
        return;
      }
      clearTimeout(tapTimer);
      if (isDouble) { toggleFullscreen(); return; }
      tapTimer = setTimeout(toggle, 240);
    }

    function paintAmbience() {
      const canvas = $("ambience");
      try {
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.classList.add("on");
      } catch {
        canvas.classList.remove("on");
      }
    }

    function startPlayer() {
      video.removeAttribute("controls");
      stage.classList.add("custom");

      const volume = Number(recall("hrp:volume"));
      if (recall("hrp:volume") !== null && Number.isFinite(volume)) setVolume(volume, false);
      const speed = Number(recall("hrp:speed"));
      if (SPEEDS.includes(speed)) video.defaultPlaybackRate = video.playbackRate = speed;
      if (document.pictureInPictureEnabled && !video.disablePictureInPicture) $("pip").hidden = false;

      video.addEventListener("pointerup", onScreenTap);
      $("big").addEventListener("click", toggle);
      $("toggle").addEventListener("click", toggle);
      $("back").addEventListener("click", () => seekBy(-SKIP, 22));
      $("forward").addEventListener("click", () => seekBy(SKIP, 78));
      $("mute").addEventListener("click", () => {
        if (video.volume === 0) setVolume(0.6);
        else video.muted = !video.muted;
      });
      $("time").addEventListener("click", () => { showRemaining = !showRemaining; drawProgress(); });
      $("full").addEventListener("click", toggleFullscreen);
      $("pip").addEventListener("click", () => {
        (document.pictureInPictureElement ? document.exitPictureInPicture() : video.requestPictureInPicture()).catch(() => {});
      });
      $("speed").addEventListener("click", () => {
        const open = $("speed-menu").hidden;
        $("speed-menu").hidden = !open;
        $("speed").setAttribute("aria-expanded", String(open));
        showControls();
      });
      document.addEventListener("pointerdown", (event) => {
        if (!$("speed-menu").hidden && !event.target.closest("#speed-menu, #speed")) closeMenu();
      });

      stage.addEventListener("pointermove", (event) => { if (event.pointerType !== "touch") showControls(); });
      stage.addEventListener("pointerleave", (event) => {
        if (event.pointerType !== "touch" && !video.paused && !dragging) stage.classList.remove("controls-on");
      });
      stage.addEventListener("focusin", (event) => { if (event.target.matches(":focus-visible")) showControls(); });

      video.addEventListener("play", () => {
        stage.classList.remove("paused");
        $("toggle").setAttribute("aria-pressed", "true");
        $("toggle").setAttribute("aria-label", "Pause");
        showControls();
      });
      video.addEventListener("pause", () => {
        stage.classList.add("paused");
        $("toggle").setAttribute("aria-pressed", "false");
        $("toggle").setAttribute("aria-label", "Play");
        showControls();
        remember(resumeKey, video.currentTime);
      });
      video.addEventListener("waiting", () => {
        clearTimeout(waitTimer);
        waitTimer = setTimeout(() => stage.classList.add("waiting"), 200);
      });
      for (const name of ["playing", "canplay", "seeked", "pause"]) {
        video.addEventListener(name, () => { clearTimeout(waitTimer); if (name !== "pause" || video.readyState > 2) stage.classList.remove("waiting"); });
      }
      video.addEventListener("loadedmetadata", () => {
        drawProgress();
        const saved = Number(recall(resumeKey));
        if (!resumeChecked && saved > 15 && saved < video.duration - 30) {
          video.currentTime = saved;
          flash("Resumed at " + clock(saved));
        }
        resumeChecked = true;
      });
      video.addEventListener("timeupdate", () => {
        if (!dragging) drawProgress();
        if (Date.now() - lastSaved > 5000 && !video.paused) {
          lastSaved = Date.now();
          remember(resumeKey, video.currentTime);
        }
      });
      video.addEventListener("progress", drawBuffered);
      video.addEventListener("volumechange", drawVolume);
      video.addEventListener("ratechange", drawSpeeds);
      video.addEventListener("ended", () => { forget(resumeKey); showControls(); });
      video.addEventListener("error", () => { $("fail").hidden = false; stage.classList.remove("paused"); });
      video.addEventListener("seeked", paintAmbience);
      video.addEventListener("loadeddata", paintAmbience);
      setInterval(() => { if (!video.paused && !document.hidden) paintAmbience(); }, 700);

      document.addEventListener("fullscreenchange", () => {
        const on = Boolean(document.fullscreenElement);
        $("full").setAttribute("aria-pressed", String(on));
        $("full").setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      });

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (event.ctrlKey || event.metaKey || event.altKey || target.matches("input, textarea, select")) return;
        const onControl = target.matches("button, a");
        const slidingVolume = target === $("volume");
        switch (event.key) {
          case " ":
            if (onControl) return;
            toggle();
            break;
          case "k": toggle(); break;
          case "ArrowLeft":
            if (slidingVolume) setVolume(video.volume - 0.05); else seekBy(-SKIP, 22);
            break;
          case "j": seekBy(-SKIP, 22); break;
          case "ArrowRight":
            if (slidingVolume) setVolume(video.volume + 0.05); else seekBy(SKIP, 78);
            break;
          case "l": seekBy(SKIP, 78); break;
          case "ArrowUp": setVolume(video.volume + 0.05); flash(Math.round(video.volume * 100) + "%"); break;
          case "ArrowDown": setVolume(video.volume - 0.05); flash(Math.round(video.volume * 100) + "%"); break;
          case "m": $("mute").click(); break;
          case "f": toggleFullscreen(); break;
          default:
            if (event.key >= "0" && event.key <= "9" && video.duration) video.currentTime = video.duration * (Number(event.key) / 10);
            else return;
        }
        event.preventDefault();
        showControls();
      });

      drawVolume();
      drawSpeeds();
      drawProgress();
    }
    startPlayer();
  </script>
</body>
</html>
