<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ file_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23241018%27/%3E%3Cpath d=%27M11 8l14 8-14 8z%27 fill=%27%23f2b84b%27/%3E%3C/svg%3E" />
  <style>
    {% include "theme.css" %}
    .stage { background: #000; }
    video { display: block; width: 100%; max-height: 78dvh; margin: 0 auto; background: #000; }
    /* The screen throws light onto the room below it */
    .room {
      background: radial-gradient(120% 220px at 50% 0, rgba(242, 184, 75, .17), transparent 72%);
      padding: clamp(1.5rem, 4vw, 3rem) 16px 3rem;
    }
    .details { max-width: 56rem; margin: 0 auto; }
    .size { margin-top: .5rem; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    #playback-note { margin-top: 1rem; color: var(--amber); }
    @media (max-width: 30rem) { .actions .button { flex: 1 1 calc(50% - .5rem); } }
  </style>
</head>
<body>
  <div class="stage">
    <video id="player" src="{{ file_url }}" controls playsinline preload="metadata"></video>
  </div>
  <main class="room">
    <div class="details">
      <h1>{{ file_name }}</h1>
      <p class="size">{{ file_size }}</p>
      <p id="playback-note" role="status" hidden>This browser can't play this file. Open it in VLC or MX Player.</p>
      <div class="actions">
        <a class="button lit" id="vlc" href="vlc://{{ file_url }}">Open in VLC</a>
        <a class="button" id="mx" href="intent:{{ file_url }}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end">Open in MX Player</a>
        <a class="button" id="mx-pro" href="intent:{{ file_url }}#Intent;package=com.mxtech.videoplayer.pro;type=video/*;end">Open in MX Player Pro</a>
        <a class="button" href="{{ file_url }}" download>Download</a>
        <button class="button" id="copy" type="button">Copy link</button>
      </div>
    </div>
  </main>
  <script>
    const fileUrl = {{ file_url|tojson }};
    const copyButton = document.getElementById("copy");
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(fileUrl);
      } catch {
        const field = document.createElement("input");
        field.value = fileUrl;
        document.body.append(field);
        field.select();
        document.execCommand("copy");
        field.remove();
      }
      copyButton.textContent = "Link copied";
      setTimeout(() => { copyButton.textContent = "Copy link"; }, 2000);
    });
    document.getElementById("player").addEventListener("error", () => {
      document.getElementById("playback-note").hidden = false;
    });
    if (!/Android/i.test(navigator.userAgent)) {
      document.getElementById("mx").remove();
      document.getElementById("mx-pro").remove();
    }
  </script>
</body>
</html>
