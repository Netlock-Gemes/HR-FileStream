<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>HR Library</title>
  <style>
    {% include "theme.css" %}
    body { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100dvh; }
    nav {
      position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: .2rem;
      height: 100dvh; padding: 1.5rem .85rem 1rem; background: var(--curtain-deep); box-shadow: inset -1px 0 0 var(--line);
    }
    .brand { padding: 0 .8rem 1.4rem; font: 400 1.7rem/1.1 var(--title); letter-spacing: -.01em; }
    .tab {
      display: flex; align-items: center; min-height: 2.75rem; padding: .5rem .8rem; border: 0; border-radius: 10px; background: none;
      color: var(--muted); font: 600 .95rem/1 var(--ui); text-align: left; cursor: pointer; transition: background-color .15s, color .15s;
    }
    .tab:hover { background: rgba(255, 236, 220, .05); color: var(--screen); }
    .tab[aria-current="page"] { background: var(--panel); color: var(--amber); box-shadow: inset 0 0 0 1px var(--line); }
    #logout { margin-top: auto; }
    #logout button { width: 100%; }
    main { padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1rem, 3.5vw, 3rem) 8rem; min-width: 0; }
    .head { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; }
    .note { font-size: .92rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .grow { flex: 1 1 14rem; min-width: 0; }
    input[type="text"], input[type="search"], select, textarea {
      width: 100%; min-height: 2.75rem; padding: .5rem .85rem;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--curtain-deep); color: var(--screen); font: 500 .96rem/1.35 var(--ui);
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:hover, input[type="search"]:hover, select:hover, textarea:hover { border-color: var(--line-up); }
    input[type="text"]:focus, input[type="search"]:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245, 189, 85, .16);
    }
    ::placeholder { color: var(--muted); opacity: .7; }
    select { width: auto; max-width: 100%; flex: 0 1 auto; cursor: pointer; }
    textarea { min-height: 7rem; resize: vertical; }
    label.field { display: block; margin-top: 1.15rem; color: var(--muted); font-size: .86rem; font-weight: 600; }
    label.field > input, label.field > textarea, label.field > select { margin-top: .35rem; width: 100%; color: var(--screen); }
    .field-title { display: block; margin-top: 1.15rem; color: var(--muted); font-size: .86rem; font-weight: 600; }
    .button.small { min-height: 2.25rem; padding: .25rem .75rem; border-radius: 9px; font-size: .84rem; }
    .button.danger { color: var(--danger); }
    .switch { display: inline-flex; gap: .5rem; align-items: center; min-height: 2.25rem; cursor: pointer; }
    .switch input, .check input { width: 1.15rem; height: 1.15rem; accent-color: var(--amber); }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16.5rem), 1fr)); gap: 1.9rem 1.15rem; margin-top: 1.5rem; }
    .card { position: relative; min-width: 0; }
    .shot {
      position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; overflow: hidden;
      border: 0; border-radius: 12px; background: var(--panel); cursor: pointer;
      box-shadow: 0 0 0 1px var(--line); transition: box-shadow .2s, transform .25s var(--ease);
    }
    .shot img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .45s var(--ease); }
    .shot:hover { box-shadow: 0 0 0 1px var(--line-up), 0 18px 40px -18px rgba(0, 0, 0, .9); transform: translateY(-2px); }
    .shot:hover img { transform: scale(1.035); }
    .length {
      position: absolute; right: .45rem; bottom: .45rem; padding: .16rem .45rem; border-radius: 6px;
      background: rgba(14, 7, 11, .76); color: var(--screen); font: 700 .74rem/1.3 var(--ui); font-variant-numeric: tabular-nums;
    }
    .card.picked .shot { box-shadow: 0 0 0 2px var(--amber); }
    .card.dim img { opacity: .35; }
    .pick {
      position: absolute; top: .4rem; left: .4rem; z-index: 1; display: grid; place-items: center;
      width: 2.4rem; height: 2.4rem; border-radius: 9px; background: rgba(14, 7, 11, .62); cursor: pointer; transition: opacity .15s;
    }
    .pick input { width: 1.15rem; height: 1.15rem; accent-color: var(--amber); }
    @media (hover: hover) {
      .pick { opacity: 0; }
      .card:hover .pick, .card.picked .pick, .pick:focus-within { opacity: 1; }
    }
    .card h2 { margin-top: .65rem; font: 400 1.22rem/1.2 var(--title); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sub { margin-top: .15rem; color: var(--muted); font-size: .84rem; overflow-wrap: anywhere; }
    #more { display: block; margin: 2.25rem auto 0; }
    .empty { margin-top: 2rem; color: var(--muted); }

    #bulk {
      position: fixed; inset: auto 1rem 1rem 16rem; z-index: 5; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      padding: .7rem .85rem; border-radius: 14px;
      background: rgba(33, 19, 26, .82); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      box-shadow: 0 18px 50px -14px rgba(0, 0, 0, .9), 0 0 0 1px var(--line-up);
    }
    #bulk input { flex: 1 1 10rem; width: auto; min-height: 2.25rem; }
    #bulk select { min-height: 2.25rem; padding-block: .2rem; }

    #drawer {
      position: fixed; inset: 0 0 0 auto; z-index: 10; width: min(100%, 33rem); margin: 0; max-height: none; height: 100dvh;
      padding: 1.1rem 1.4rem 3rem; overflow-y: auto; border: 0; box-shadow: -1px 0 0 var(--line), -30px 0 80px -20px rgba(0, 0, 0, .8);
      background: var(--curtain); color: var(--screen);
    }
    #drawer[open] { animation: slide-in .32s var(--ease); }
    @keyframes slide-in { from { transform: translateX(2.5rem); opacity: 0; } }
    #drawer::backdrop { background: rgba(14, 7, 11, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .drawer-poster { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
    .chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
    .chip {
      display: inline-flex; align-items: center; gap: .15rem; min-height: 2rem; padding: 0 .2rem 0 .7rem;
      border-radius: 999px; background: var(--panel-up); color: var(--screen); font-size: .86rem; font-weight: 600;
    }
    .chip button { width: 1.7rem; height: 1.7rem; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 1rem; cursor: pointer; }
    .chip button:hover { background: rgba(255, 236, 220, .1); color: var(--screen); }
    .check { display: inline-flex; gap: .45rem; align-items: center; min-height: 2.25rem; margin-right: .85rem; color: var(--screen); font-size: .92rem; font-weight: 500; cursor: pointer; }
    code { display: block; padding: .6rem .75rem; border-radius: 10px; background: var(--curtain-deep); box-shadow: inset 0 0 0 1px var(--line); font-size: .8rem; overflow-wrap: anywhere; }

    .list { margin-top: 1.25rem; display: grid; gap: .5rem; }
    .line {
      display: flex; flex-wrap: wrap; gap: .6rem .9rem; align-items: center; padding: .8rem 1rem; border-radius: 14px;
      background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
    }
    .face {
      position: relative; flex: none; width: 3.5rem; height: 3.5rem; overflow: hidden; border-radius: 50%;
      background: var(--panel-up); color: var(--amber); font: 400 1.5rem/3.5rem var(--title); text-align: center; cursor: pointer;
    }
    .face img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .face input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .line strong { font-weight: 700; }
    .panel { flex: 1 1 100%; padding: .25rem 0 .5rem; }
    .progress { color: var(--amber); font-size: .88rem; }

    #status {
      position: fixed; right: 16px; top: 16px; z-index: 20; max-width: min(24rem, calc(100vw - 32px));
      padding: .55rem .9rem; border-radius: 10px; background: var(--amber); color: #241305; font-size: .9rem; font-weight: 700;
      box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .8);
    }
    #status.bad { background: var(--danger); }
    #status:empty { display: none; }

    @media (max-width: 48rem) {
      body { display: block; }
      nav {
        position: fixed; inset: auto 0 0; z-index: 6; flex-direction: row; justify-content: space-around; height: auto; gap: .1rem;
        padding: .3rem .3rem calc(.3rem + env(safe-area-inset-bottom));
        background: rgba(14, 7, 11, .86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 var(--line);
      }
      .brand, #logout { display: none; }
      .tab { flex: 1; justify-content: center; padding: .5rem .1rem; font-size: .8rem; }
      #bulk { inset: auto .5rem calc(3.9rem + env(safe-area-inset-bottom)); }
      main { padding-bottom: 12rem; }
      #logout-mobile { display: inline-flex; }
    }
    @media (min-width: 48.01rem) { #logout-mobile { display: none; } }
  </style>
</head>
<body>
  <nav aria-label="Dashboard">
    <div class="brand">HR Library</div>
    <button class="tab" data-view="media">Media</button>
    <button class="tab" data-view="cast">Cast</button>
    <button class="tab" data-view="catalogs">Catalogs</button>
    <button class="tab" data-view="channels">Channels</button>
    <button class="tab" data-view="addon">Addon</button>
    <form id="logout" method="post" action="/dashboard/logout"><button class="button small" type="submit">Log out</button></form>
  </nav>
  <main id="view"></main>
  <dialog id="drawer" aria-label="Edit video"></dialog>
  <div id="status" role="status"></div>

  <script>
    const API = "/dashboard/api";
    const view = document.getElementById("view");
    const drawer = document.getElementById("drawer");
    const statusBox = document.getElementById("status");
    const store = { overview: {}, cast: [], catalogs: [], channels: [] };
    const media = { q: "", label: "", catalog: "", channel: "", state: "", sort: "newest", skip: 0, items: [], total: 0, picked: new Set() };
    let statusTimer, searchTimer, importTimer;

    function h(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else if (key === "class") node.className = value;
        else if (typeof value === "boolean") { if (value) node.setAttribute(key, ""); }
        else if (key === "value") node.value = value;
        else if (value !== undefined && value !== null) node.setAttribute(key, value);
      }
      node.append(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
      return node;
    }

    function say(text, bad = false) {
      statusBox.textContent = text;
      statusBox.classList.toggle("bad", bad);
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusBox.textContent = ""; }, bad ? 5000 : 2200);
    }

    async function api(path, method = "GET", body) {
      const isFile = body instanceof Blob;
      const response = await fetch(API + path, {
        method,
        headers: { "X-HR-Dashboard": "1", ...(body && !isFile ? { "Content-Type": "application/json" } : {}) },
        body: isFile ? body : body ? JSON.stringify(body) : undefined,
      });
      if (response.status === 401) { location.href = "/dashboard/login"; throw new Error("Log in again."); }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "That didn't work. Try again.");
      return data;
    }

    // Runs an action and reports its failure, so no handler can fail silently
    async function attempt(action, success) {
      try {
        const result = await action();
        if (success) say(typeof success === "function" ? success(result) : success);
        return result;
      } catch (error) {
        say(error.message, true);
        return undefined;
      }
    }

    function splitNames(text) { return text.split(",").map((name) => name.trim()).filter(Boolean); }
    function plural(count, word) { return count + " " + word + (count === 1 ? "" : "s"); }
    function datalist(id, values) { return h("datalist", { id }, values.map((value) => new Option(value))); }
    function copy(text, done) { attempt(() => navigator.clipboard.writeText(text), done); }

    async function loadShared() {
      const [overview, cast, catalogs, channels] = await Promise.all([api("/overview"), api("/cast"), api("/catalogs"), api("/channels")]);
      store.overview = overview;
      store.cast = cast.cast;
      store.catalogs = catalogs.catalogs;
      store.channels = channels.channels;
    }

    /* ---------- Media ---------- */

    function drawBulk() {
      document.getElementById("bulk")?.remove();
      if (!media.picked.size) return;
      const value = h("input", { type: "text", list: "cast-names", placeholder: "Cast names, separated by commas", "aria-label": "Cast to add" });
      const catalogSelect = h("select", { "aria-label": "Catalog" }, store.catalogs.filter((catalog) => !catalog.all).map((catalog) => new Option(catalog.name, catalog.id)));
      const run = (action, extra, message) => attempt(async () => {
        await api("/media/bulk", "POST", { ids: [...media.picked], action, value: extra });
        media.picked.clear();
        await reloadMedia();
      }, message);
      document.body.append(h("div", { id: "bulk" },
        h("span", {}, media.picked.size + " selected"),
        value,
        h("button", { class: "button small lit", onclick: () => run("add_cast", value.value, "Cast added") }, "Add cast"),
        catalogSelect.options.length ? catalogSelect : null,
        catalogSelect.options.length ? h("button", { class: "button small", onclick: () => run("add_catalog", catalogSelect.value, "Added to catalog") }, "Add to catalog") : null,
        h("button", { class: "button small", onclick: () => run("hide", null, "Hidden from the addon") }, "Hide"),
        h("button", { class: "button small", onclick: () => run("show", null, "Shown in the addon") }, "Show"),
        h("button", { class: "button small danger", onclick: () => confirm("Remove " + plural(media.picked.size, "video") + "? Their links stop working. The channel posts stay.") && run("delete", null, "Removed") }, "Remove"),
        h("button", { class: "button small", onclick: () => { media.picked.clear(); drawMediaGrid(); } }, "Clear"),
      ));
    }

    function card(item) {
      const picked = media.picked.has(item.id);
      return h("article", { class: "card" + (picked ? " picked" : "") + (item.hidden ? " dim" : "") },
        h("label", { class: "pick" }, h("input", {
          type: "checkbox", "aria-label": "Select " + item.title, checked: picked,
          onchange: (event) => {
            event.target.checked ? media.picked.add(item.id) : media.picked.delete(item.id);
            event.target.closest(".card").classList.toggle("picked", event.target.checked);
            drawBulk();
          },
        })),
        h("button", { class: "shot", type: "button", "aria-label": "Edit " + item.title, onclick: () => openEditor(item) },
          h("img", { src: item.poster, alt: "", loading: "lazy" }),
          item.duration ? h("span", { class: "length" }, item.duration + " min") : null),
        h("h2", {}, item.title),
        h("p", { class: "sub" }, item.cast.length ? item.cast.join(", ") : "No cast yet"),
        h("p", { class: "sub" }, item.size + (item.hidden ? ", hidden" : "")),
      );
    }

    function drawMediaGrid() {
      const grid = document.getElementById("grid");
      if (!grid) return;
      grid.replaceChildren(...media.items.map(card));
      document.getElementById("media-count").textContent = plural(media.total, "video");
      document.getElementById("more").hidden = media.items.length >= media.total;
      const empty = document.getElementById("empty");
      empty.hidden = media.items.length > 0;
      empty.textContent = store.overview.videos ? "No videos match. Clear the search or filters." : "Post a video in a library channel and it appears here.";
      drawBulk();
    }

    async function fetchMedia() {
      const params = new URLSearchParams({ skip: media.skip, sort: media.sort });
      for (const [key, value] of [["q", media.q], ["label", media.label], ["catalog", media.catalog], ["channel", media.channel], ["state", media.state]]) {
        if (value) params.set(key, value);
      }
      return api("/media?" + params);
    }

    async function reloadMedia() {
      media.skip = 0;
      const data = await fetchMedia();
      media.items = data.items;
      media.total = data.total;
      media.skip = data.items.length;
      drawMediaGrid();
    }

    function picker(label, key, options) {
      return h("select", {
        "aria-label": label,
        onchange: (event) => { media[key] = event.target.value; attempt(reloadMedia); },
      }, new Option(label, ""), options.map(([text, value]) => {
        const option = new Option(text, value);
        option.selected = String(media[key]) === String(value);
        return option;
      }));
    }

    async function showMedia() {
      view.replaceChildren(
        h("div", { class: "head" }, h("h1", {}, "Media"), h("p", { class: "note", id: "media-count" })),
        h("div", { class: "row" },
          h("input", {
            class: "grow", type: "search", placeholder: "Search titles, captions and file names", "aria-label": "Search", value: media.q,
            oninput: (event) => {
              clearTimeout(searchTimer);
              searchTimer = setTimeout(() => { media.q = event.target.value.trim(); attempt(reloadMedia); }, 250);
            },
          }),
          picker("All cast", "label", store.cast.map((person) => [person.name, person.name])),
          picker("All catalogs", "catalog", store.catalogs.map((catalog) => [catalog.name, catalog.id])),
          picker("All channels", "channel", store.channels.map((channel) => [channel.title, channel.id])),
          picker("Any state", "state", [["No cast yet", "uncast"], ["Hidden", "hidden"]]),
          h("select", { "aria-label": "Sort", onchange: (event) => { media.sort = event.target.value; attempt(reloadMedia); } },
            [["Newest", "newest"], ["Oldest", "oldest"], ["Title", "title"], ["Largest", "largest"]].map(([text, value]) => {
              const option = new Option(text, value);
              option.selected = media.sort === value;
              return option;
            })),
        ),
        h("div", { id: "grid" }),
        h("p", { class: "empty", id: "empty", hidden: true }),
        h("button", {
          class: "button", id: "more", hidden: true,
          onclick: () => attempt(async () => {
            const data = await fetchMedia();
            media.items.push(...data.items);
            media.skip += data.items.length;
            drawMediaGrid();
          }),
        }, "Show more"),
        datalist("cast-names", store.cast.map((person) => person.name)),
      );
      await reloadMedia();
    }

    function replaceItem(item) {
      const index = media.items.findIndex((other) => other.id === item.id);
      if (index >= 0) media.items[index] = item;
      drawMediaGrid();
    }

    function openEditor(item) {
      const save = (fields, message) => attempt(async () => {
        const saved = await api("/media/" + item.id, "PATCH", fields);
        Object.assign(item, saved);
        replaceItem(item);
        drawEditor();
        return saved;
      }, message);

      const uploadPoster = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        attempt(async () => {
          Object.assign(item, await api("/media/" + item.id + "/poster", "PUT", file));
          replaceItem(item);
          drawEditor();
        }, "Thumbnail saved");
      };

      function drawEditor() {
        const castInput = h("input", {
          type: "text", list: "cast-names", placeholder: "Add a name, then press Enter", "aria-label": "Add cast",
          onkeydown: (event) => {
            if (event.key !== "Enter") return;
            event.preventDefault();
            const names = splitNames(castInput.value);
            if (names.length) save({ cast: [...item.cast, ...names] }, "Cast saved");
          },
        });
        const manual = store.catalogs.filter((catalog) => !catalog.all);
        const postUrl = item.channel_id ? "https://t.me/c/" + String(item.channel_id).replace(/^-100/, "") + "/" + item.message_id : null;

        drawer.replaceChildren(
          h("div", { class: "row", style: "justify-content: space-between; margin-bottom: .75rem" },
            h("a", { class: "button small", href: item.watch, target: "_blank", rel: "noopener" }, "Watch"),
            h("button", { class: "button small", onclick: () => drawer.close() }, "Close")),
          h("img", { class: "drawer-poster", src: item.poster, alt: "" }),
          h("div", { class: "row", style: "margin-top: .5rem" },
            h("label", { class: "button small" }, "Upload thumbnail", h("input", { type: "file", accept: "image/*", hidden: true, onchange: uploadPoster })),
            item.poster_custom ? h("button", {
              class: "button small",
              onclick: () => attempt(async () => {
                Object.assign(item, await api("/media/" + item.id + "/poster", "DELETE"));
                replaceItem(item);
                drawEditor();
              }, "Back to the Telegram thumbnail"),
            }, "Use Telegram thumbnail") : null),
          h("label", { class: "field" }, "Title", h("input", { type: "text", value: item.title, onchange: (event) => save({ title: event.target.value }, "Title saved") })),
          h("label", { class: "field" }, "Description", h("textarea", { onchange: (event) => save({ description: event.target.value }, "Description saved") }, item.description)),
          h("span", { class: "field-title" }, "Cast"),
          h("div", { class: "chips" }, item.cast.map((name) => h("span", { class: "chip" }, name,
            h("button", { type: "button", "aria-label": "Remove " + name, onclick: () => save({ cast: item.cast.filter((other) => other !== name) }, "Cast saved") }, "×")))),
          h("div", { style: "margin-top: .4rem" }, castInput),
          h("label", { class: "field" }, "Tags, separated by commas", h("input", { type: "text", value: item.tags.join(", "), onchange: (event) => save({ tags: event.target.value }, "Tags saved") })),
          manual.length ? h("span", { class: "field-title" }, "Catalogs") : null,
          h("div", {}, manual.map((catalog) => h("label", { class: "check" },
            h("input", {
              type: "checkbox", checked: item.catalogs.includes(catalog.id),
              onchange: (event) => save({ catalogs: event.target.checked ? [...item.catalogs, catalog.id] : item.catalogs.filter((id) => id !== catalog.id) }, "Catalogs saved"),
            }), catalog.name))),
          h("div", { style: "margin-top: 1rem" }, h("label", { class: "switch" },
            h("input", { type: "checkbox", checked: item.hidden, onchange: (event) => save({ hidden: event.target.checked }, event.target.checked ? "Hidden from the addon" : "Shown in the addon") }),
            "Hide from the addon")),
          h("span", { class: "field-title" }, "Content link"),
          h("code", {}, item.url),
          h("div", { class: "row", style: "margin-top: .5rem" },
            h("button", { class: "button small", onclick: () => copy(item.url, "Link copied") }, "Copy link"),
            postUrl ? h("a", { class: "button small", href: postUrl, target: "_blank", rel: "noopener" }, "Open Telegram post") : null),
          h("span", { class: "field-title" }, "File"),
          h("p", { class: "sub" }, item.file_name + ", " + item.size),
          item.caption ? h("span", { class: "field-title" }, "Caption") : null,
          item.caption ? h("p", { class: "sub", style: "white-space: pre-line" }, item.caption) : null,
          h("button", {
            class: "button small danger", style: "margin-top: 1.5rem",
            onclick: () => confirm('Remove "' + item.title + '"? Its links stop working. The channel post stays.') && attempt(async () => {
              await api("/media/" + item.id, "DELETE");
              media.items = media.items.filter((other) => other.id !== item.id);
              media.total -= 1;
              media.picked.delete(item.id);
              drawer.close();
              drawMediaGrid();
            }, "Removed"),
          }, "Remove from library"),
        );
      }

      drawEditor();
      if (!drawer.open) drawer.showModal();
    }

    /* ---------- Cast ---------- */

    async function showCast() {
      const names = h("input", { class: "grow", type: "text", placeholder: "Names, separated by commas", "aria-label": "Cast names" });
      const refresh = async () => { store.cast = (await api("/cast")).cast; drawCast(); };
      const add = (event) => {
        event.preventDefault();
        attempt(async () => {
          const result = await api("/cast", "POST", { names: names.value });
          names.value = "";
          await refresh();
          return result;
        }, (result) => plural(result.added, "name") + " added, connected to " + plural(result.connected, "video"));
      };

      function person(entry) {
        const photo = h("label", { class: "face", title: "Upload a photo" },
          entry.photo ? h("img", { src: entry.photo, alt: "" }) : entry.name[0].toUpperCase(),
          h("input", {
            type: "file", accept: "image/*", "aria-label": "Upload a photo of " + entry.name,
            onchange: (event) => event.target.files[0] && attempt(async () => {
              await api("/cast/" + entry.id + "/photo", "PUT", event.target.files[0]);
              await refresh();
            }, "Photo saved"),
          }));
        const patch = (fields) => attempt(async () => {
          const result = await api("/cast/" + entry.id, "PATCH", fields);
          await refresh();
          return result;
        }, (result) => result.connected ? "Saved, connected to " + plural(result.connected, "more video") : "Saved");
        return h("div", { class: "line" }, photo,
          h("div", { class: "grow" },
            h("input", { type: "text", value: entry.name, "aria-label": "Name", onchange: (event) => patch({ name: event.target.value }) }),
            h("input", {
              type: "text", value: entry.aliases.join(", "), placeholder: "Other spellings, separated by commas", "aria-label": "Other spellings", style: "margin-top: .3rem",
              onchange: (event) => patch({ aliases: event.target.value }),
            })),
          h("button", {
            class: "button small",
            onclick: () => { Object.assign(media, { label: entry.name, q: "", catalog: "", channel: "", state: "" }); go("media"); },
          }, plural(entry.videos, "video")),
          h("button", {
            class: "button small danger",
            onclick: () => confirm("Delete " + entry.name + "? They come off every video.") && attempt(async () => {
              await api("/cast/" + entry.id, "DELETE");
              await refresh();
            }, "Deleted"),
          }, "Delete"));
      }

      function drawCast() {
        view.replaceChildren(
          h("div", { class: "head" }, h("h1", {}, "Cast"), h("p", { class: "note" }, plural(store.cast.length, "name"))),
          h("p", { class: "note" }, "A name connects to every video whose caption, title or file name contains it, now and for new posts. A name you remove from a video stays off it."),
          h("form", { class: "row", style: "margin-top: 1rem", onsubmit: add },
            names, h("button", { class: "button lit", type: "submit" }, "Add cast"),
            h("button", {
              class: "button", type: "button",
              onclick: () => attempt(async () => { const result = await api("/cast/rematch", "POST", {}); await refresh(); return result; },
                (result) => "Connected " + plural(result.connected, "more video")),
            }, "Match all videos again")),
          store.cast.length ? h("div", { class: "list" }, store.cast.map(person)) : h("p", { class: "empty" }, "Add the first name above."),
        );
      }
      drawCast();
    }

    /* ---------- Catalogs ---------- */

    function checks(values, chosen, labelOf = (value) => value) {
      const boxes = values.map(([value, text]) => ({ value, box: h("input", { type: "checkbox", checked: chosen.includes(value) }), text }));
      return {
        node: h("div", {}, boxes.map(({ box, text }) => h("label", { class: "check" }, box, labelOf(text)))),
        read: () => boxes.filter(({ box }) => box.checked).map(({ value }) => value),
      };
    }

    async function showCatalogs() {
      const open = new Set();
      const refresh = async () => { store.catalogs = (await api("/catalogs")).catalogs; drawCatalogs(); };

      function rulesForm(catalog) {
        const name = h("input", { type: "text", value: catalog.name });
        const sort = h("select", {}, [["Newest", "newest"], ["Oldest", "oldest"], ["Title", "title"], ["Largest", "largest"]].map(([text, value]) => {
          const option = new Option(text, value);
          option.selected = catalog.sort === value;
          return option;
        }));
        const cast = checks(store.cast.map((person) => [person.name, person.name]), catalog.cast);
        const channels = checks(store.channels.map((channel) => [channel.id, channel.title]), catalog.channels);
        const tags = h("input", { type: "text", value: catalog.tags.join(", ") });
        const keywords = h("input", { type: "text", value: catalog.keywords.join(", ") });
        return h("div", { class: "panel" },
          h("label", { class: "field" }, "Name", name),
          h("label", { class: "field" }, "Sort videos by", sort),
          catalog.all ? null : h("p", { class: "note", style: "margin-top: 1rem" }, "A video joins this catalog if you tick it on the video, or if it passes every rule set below. A rule with several values needs any one of them."),
          catalog.all ? null : [
            h("span", { class: "field-title" }, "Cast"), cast.node.childNodes.length ? cast.node : h("p", { class: "sub" }, "No cast yet."),
            h("span", { class: "field-title" }, "Channels"), channels.node.childNodes.length ? channels.node : h("p", { class: "sub" }, "No channels yet."),
            h("label", { class: "field" }, "Tags, separated by commas", tags),
            h("label", { class: "field" }, "Words in the caption or title, separated by commas", keywords),
          ],
          h("div", { class: "row", style: "margin-top: 1rem" },
            h("button", {
              class: "button small lit",
              onclick: () => attempt(async () => {
                const fields = { name: name.value, sort: sort.value };
                if (!catalog.all) Object.assign(fields, { cast: cast.read(), channels: channels.read(), tags: tags.value, keywords: keywords.value });
                await api("/catalogs/" + catalog.id, "PATCH", fields);
                await refresh();
              }, "Catalog saved"),
            }, "Save catalog"),
            catalog.all ? null : h("button", {
              class: "button small danger",
              onclick: () => confirm('Delete "' + catalog.name + '"? The videos stay in the library.') && attempt(async () => {
                await api("/catalogs/" + catalog.id, "DELETE");
                await refresh();
              }, "Catalog deleted"),
            }, "Delete catalog")));
      }

      function move(index, step) {
        const ids = store.catalogs.map((catalog) => catalog.id);
        [ids[index], ids[index + step]] = [ids[index + step], ids[index]];
        attempt(async () => { await api("/catalogs/reorder", "POST", { ids }); await refresh(); }, "Order saved");
      }

      function drawCatalogs() {
        const name = h("input", { class: "grow", type: "text", placeholder: "New catalog name", "aria-label": "New catalog name" });
        view.replaceChildren(
          h("div", { class: "head" }, h("h1", {}, "Catalogs"), h("p", { class: "note" }, "Each catalog is a row in Nuvio and Stremio, in this order.")),
          h("form", {
            class: "row",
            onsubmit: (event) => {
              event.preventDefault();
              attempt(async () => {
                const catalog = await api("/catalogs", "POST", { name: name.value });
                open.add(catalog.id);
                await refresh();
              }, "Catalog created");
            },
          }, name, h("button", { class: "button lit", type: "submit" }, "Create catalog")),
          h("div", { class: "list" }, store.catalogs.map((catalog, index) => h("div", { class: "line" },
            h("label", { class: "switch" },
              h("input", {
                type: "checkbox", checked: catalog.enabled, "aria-label": "Show " + catalog.name + " in the addon",
                onchange: (event) => attempt(async () => { await api("/catalogs/" + catalog.id, "PATCH", { enabled: event.target.checked }); await refresh(); }, event.target.checked ? "Catalog shown" : "Catalog hidden"),
              })),
            h("div", { class: "grow" }, h("strong", {}, catalog.name), h("p", { class: "sub" }, plural(catalog.videos, "video"))),
            h("button", { class: "button small", "aria-label": "Move up", disabled: index === 0, onclick: () => move(index, -1) }, "Up"),
            h("button", { class: "button small", "aria-label": "Move down", disabled: index === store.catalogs.length - 1, onclick: () => move(index, 1) }, "Down"),
            h("button", {
              class: "button small", "aria-expanded": String(open.has(catalog.id)),
              onclick: () => { open.has(catalog.id) ? open.delete(catalog.id) : open.add(catalog.id); drawCatalogs(); },
            }, open.has(catalog.id) ? "Close" : "Edit"),
            open.has(catalog.id) ? rulesForm(catalog) : null))),
        );
      }
      drawCatalogs();
    }

    /* ---------- Channels ---------- */

    async function showChannels() {
      const input = h("input", { class: "grow", type: "text", inputmode: "numeric", placeholder: "Channel ID, such as -1001234567890", "aria-label": "Channel ID" });
      const list = h("div", { class: "list" });

      function line(channel) {
        const state = channel.import;
        const lastPost = h("input", { type: "text", inputmode: "numeric", placeholder: "Last post ID (optional)", "aria-label": "Last post ID", style: "width: 12rem" });
        return h("div", { class: "line" },
          h("label", { class: "switch" }, h("input", {
            type: "checkbox", checked: channel.enabled, "aria-label": "Add new posts from " + channel.title,
            onchange: (event) => attempt(async () => {
              store.channels = (await api("/channels/" + channel.id, "PATCH", { enabled: event.target.checked })).channels;
              drawList();
            }, event.target.checked ? "New posts will be added" : "New posts are ignored"),
          })),
          h("div", { class: "grow" },
            h("strong", {}, channel.title), h("p", { class: "sub" }, channel.id + ", " + plural(channel.videos, "video")),
            state ? h("p", { class: "progress" }, state.error ? "Import stopped: " + state.error
              : (state.running ? "Importing, at post " : "Import finished at post ") + state.scanned + ", " + plural(state.added, "video") + " found") : null),
          lastPost,
          h("button", {
            class: "button small", disabled: Boolean(state && state.running),
            onclick: () => attempt(async () => {
              store.channels = (await api("/channels/" + channel.id + "/import", "POST", { last_post: lastPost.value })).channels;
              drawList();
              watchImports();
            }, "Import started"),
          }, "Import old posts"),
          h("button", {
            class: "button small danger",
            onclick: () => confirm("Stop using " + channel.title + "? Its videos stay in the library.") && attempt(async () => {
              store.channels = (await api("/channels/" + channel.id, "DELETE")).channels;
              drawList();
            }, "Channel removed"),
          }, "Remove"));
      }

      function drawList() {
        list.replaceChildren(...store.channels.map(line));
        if (!store.channels.length) list.replaceChildren(h("p", { class: "empty" }, "Add a channel above. The bot must be an admin there."));
      }

      function watchImports() {
        clearTimeout(importTimer);
        if (!store.channels.some((channel) => channel.import?.running)) return;
        importTimer = setTimeout(async () => {
          if (!list.isConnected) return;
          store.channels = (await api("/channels")).channels;
          drawList();
          watchImports();
        }, 2000);
      }

      view.replaceChildren(
        h("div", { class: "head" }, h("h1", {}, "Channels"), h("p", { class: "note" }, "The bot works only in these channels.")),
        h("form", {
          class: "row",
          onsubmit: (event) => {
            event.preventDefault();
            attempt(async () => {
              store.channels = (await api("/channels", "POST", { id: input.value })).channels;
              input.value = "";
              drawList();
            }, "Channel added");
          },
        }, input, h("button", { class: "button lit", type: "submit" }, "Add channel")),
        list,
      );
      drawList();
      watchImports();
    }

    /* ---------- Addon ---------- */

    async function showAddon() {
      const { addon_url: url, videos, size, uncast, hidden } = store.overview;
      view.replaceChildren(
        h("div", { class: "head" }, h("h1", {}, "Addon")),
        h("p", { class: "note" }, plural(videos, "video") + ", " + size + ". " + uncast + " without cast, " + hidden + " hidden."),
        url ? h("div", { style: "margin-top: 1.25rem; max-width: 44rem" },
          h("span", { class: "field-title" }, "Paste this link into Nuvio or Stremio to install the addon. Keep it private."),
          h("code", { style: "margin-top: .4rem" }, url),
          h("div", { class: "row", style: "margin-top: .6rem" },
            h("button", { class: "button lit", onclick: () => copy(url, "Addon link copied") }, "Copy addon link"),
            h("a", { class: "button", href: url.replace(/^https?:/, "stremio:") }, "Open in Stremio")),
        ) : h("p", { class: "empty" }, "Set ADDON_TOKEN on the server to turn the addon on."),
        h("form", { id: "logout-mobile", method: "post", action: "/dashboard/logout", style: "margin-top: 2rem" },
          h("button", { class: "button small", type: "submit" }, "Log out")),
      );
    }

    /* ---------- Navigation ---------- */

    const views = { media: showMedia, cast: showCast, catalogs: showCatalogs, channels: showChannels, addon: showAddon };

    async function go(name) {
      if (!views[name]) name = "media";
      history.replaceState(null, "", "#" + name);
      document.getElementById("bulk")?.remove();
      for (const tab of document.querySelectorAll(".tab")) {
        tab.dataset.view === name ? tab.setAttribute("aria-current", "page") : tab.removeAttribute("aria-current");
      }
      await attempt(async () => {
        await loadShared();
        await views[name]();
      });
    }

    for (const tab of document.querySelectorAll(".tab")) {
      tab.addEventListener("click", () => go(tab.dataset.view));
    }
    drawer.addEventListener("click", (event) => { if (event.target === drawer) drawer.close(); });
    go(location.hash.slice(1));
  </script>
</body>
</html>
