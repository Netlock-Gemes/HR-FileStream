<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>HR Library</title>
  <style>
    {% include "theme.css" %}
    body {
      display: grid; place-items: center; padding: 16px;
      background: radial-gradient(90% 420px at 50% 0, rgba(242, 184, 75, .14), transparent 70%), var(--curtain);
    }
    main { width: min(100%, 22rem); }
    h1 { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 1rem; color: var(--muted); }
    input {
      display: block; width: 100%; min-height: 2.75rem; margin-top: .3rem; padding: .5rem .75rem;
      border: 1px solid var(--line); border-radius: 6px;
      background: var(--curtain-deep); color: var(--screen); font: 1rem/1.3 var(--ui);
    }
    .button { width: 100%; }
    .error { margin-bottom: 1rem; color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>HR Library</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/dashboard/login">
      <label>Username <input name="user" autocomplete="username" autocapitalize="none" required autofocus /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="button lit" type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
