<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>HR Library</title>
  <style>
    {% include "theme.css" %}
    body {
      display: grid; place-items: center; padding: 16px;
      background: radial-gradient(70% 480px at 50% -60px, rgba(245, 189, 85, .17), transparent 72%), var(--curtain);
    }
    main {
      width: min(100%, 24rem); padding: clamp(1.5rem, 5vw, 2.25rem); border-radius: 18px;
      background: var(--panel); box-shadow: inset 0 0 0 1px var(--line), 0 30px 70px -28px rgba(0, 0, 0, .9);
    }
    h1 { margin-bottom: 1.5rem; font-size: 2.5rem; }
    label { display: block; margin-bottom: 1rem; color: var(--muted); font-size: .86rem; font-weight: 600; }
    input {
      display: block; width: 100%; min-height: 2.85rem; margin-top: .35rem; padding: .5rem .85rem;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--curtain-deep); color: var(--screen); font: 500 1rem/1.3 var(--ui);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245, 189, 85, .16); }
    .button { width: 100%; margin-top: .25rem; }
    .error { margin-bottom: 1rem; color: var(--danger); font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <h1>HR Library</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/dashboard/login">
      <label>Username <input name="user" autocomplete="username" autocapitalize="none" required autofocus /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="button lit" type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
